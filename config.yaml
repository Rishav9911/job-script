titles:
  - software engineer          # already covers software developer / SDE via aliases
  - software development engineer
  - sde
  - ai engineer
  - artificial intelligence engineer
  - machine learning engineer
  - ml engineer
  - data engineer
  - backend engineer
  - frontend engineer
  - full stack engineer
  - fullstack engineer
  - web developer
  - python developer
  - java developer
  - applied scientist          # Amazon uses this for ML roles
  - research engineer
  - associate software engineer
  - graduate engineer trainee



exclude_title_words:         # skip titles containing any of these
  - senior
  - staff
  - principal
  - lead
  - manager
  - director
  - architect
  - sr.
  - test
  - quality
  - management
  - business
  - it
  - chief
  - operations
  - hardware
  - internship
  - contract
  - consultant
  - phd
  - support


max_years_experience: 1      # accept if required minimum years is BELOW this (1 = freshers / under 1 year)

use_model: true
ollama_model: qwen2.5:3b     # switch to qwen2.5:7b if you see wrong answers

# ollama_url: https://blocks-worcester-valves-bin.trycloudflare.com      #for remote ollama server (copy from the colab output cell)
ollama_url: http://localhost:11434      #for local ollama server (default port 11434)

model_timeout_seconds: 180
workday_parallel: 6          # how many Workday requests at once (all companies share this)
workday_gap_seconds: 0.15    # minimum pause between Workday requests
locations:                   # job location must contain one of these ([] = no filter)
  - bengaluru
  - bangalore
  - india
  - gurugram
  - gurgaon
  - pune
  - hyderabad
  - noida
  - goa
  - mumbai
  - chennai
  - tamil nadu
  - karnataka

exclude_description_words: []   # e.g. ["security clearance"]

max_runtime_minutes: 180
output_dir: output

